server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: tradetwin-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tradetwin}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

# App security configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# AI Engine configuration
tradetwin:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    currency: ${PAYPAL_CURRENCY:USD}
    delegated-vault-enabled: ${PAYPAL_DELEGATED_VAULT_ENABLED:false}

# Actuator Health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
